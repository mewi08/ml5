<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/estilos.css" />
    <title>ML5</title>

    <!-- CDN -->
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  </head>
  <body>
    <div class="contenedor">
      <h2>ML5 - Modelo HandPose</h2>

      <p>Coloca tu mano frente a la cámara y mueve tu dedo índice.</p>

      <div class="result" id="ml5-result"><!-- Result --></div>

      <p>
        Esta aplicación utiliza la cámara y el modelo HandPose de ML5 para
        detectar la mano y seguir el movimiento del dedo índice en tiempo real
        mediante un círculo.
      </p>
    </div>

    <script>
      let handPose;
      let video;
      let hands = [];
      let distancia;

      async function setup() {
        handPose = await ml5.handPose();

        let lienzo = createCanvas(640, 480);
        lienzo.parent("ml5-result");

        video = createCapture(VIDEO);
        video.size(640, 480);
        video.hide();
        handPose.detectStart(video, gotHands);
      }

      async function draw() {
        image(video, 0, 0, width, height);

        if (hands.length > 0) {
          let finger = hands[0].index_finger_tip;

          fill(0, 255, 0, 200);
          stroke(0);
          strokeWeight(2);
          circle(finger.x, finger.y, 40);
        }
      }

      async function gotHands(results) {
        hands = results;
      }
    </script>
  </body>
</html>
