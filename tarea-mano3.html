<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/estilos.css" />
    <title>ML5</title>

    <!-- CDN -->
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  </head>
  <body>
    <div class="contenedor">
      <h2>ML5 - Modelo HandPose</h2>

      <p>
        Coloca tu mano frente a la cámara y junta tu dedo índice con el pulgar
        para formar una pinza.
      </p>

      <div class="result" id="ml5-result"><!-- Result --></div>

      <p>
        Esta aplicación utiliza la cámara y el modelo HandPose de ML5 para
        detectar la mano y dibujar un círculo que cambia de color según su
        tamaño.
      </p>
    </div>

    <script>
      let handPose;
      let video;
      let hands = [];
      let distancia;
      let color = [];

      async function setup() {
        handPose = await ml5.handPose();
        
        let lienzo = createCanvas(640, 480);
        lienzo.parent("ml5-result");

        video = createCapture(VIDEO);
        video.size(640, 480);
        video.hide();
        handPose.detectStart(video, gotHands);
      }

      async function draw() {
        image(video, 0, 0, width, height);

        if (hands.length > 0) {
          let finger = hands[0].index_finger_tip;
          let thumb = hands[0].thumb_tip;

          let centerX = (finger.x + thumb.x) / 2;
          let centerY = (finger.y + thumb.y) / 2;
          distancia = dist(finger.x, finger.y, thumb.x, thumb.y);

          if (distancia <= 50) {
            color = [0, 255, 0];
          } else if (distancia <= 100) {
            color = [0, 0, 255];
          } else {
            color = [255, 0, 0];
          }

          fill(color);
          stroke(0);
          strokeWeight(2);
          circle(centerX, centerY, distancia);
        }
      }

      async function gotHands(results) {
        hands = results;
      }
    </script>
  </body>
</html>
