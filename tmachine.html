<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./styles/estilos.css" />

    <title>Teachable Machine</title>
    <!-- CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@0.5.0/dist/ml5.min.js" type="text/javascript"></script>
  </head>
  <body>
    <div class="contenedor">
      <h2>Teachable Machine Image Model</h2>

      <p>Coloca un objeto frente a la cámara.</p>

      <div class="result" id="tm-video"></div>
      
      <button class="speechSynthesis" id="tm-audio">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-volume-2 preview-icon"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
      </button>

      <div class="chart" id="tm-result"></div>
      <p>
        Esta aplicación utiliza la cámara y el modelo Image de Teachable Machine
        para reconocer objetos en tiempo real. Para obtener mejores resultados,
        se recomienda mostrar los objetos sobre un fondo despejado.
      </p>
    </div>

    <script>
      let classifier;
      let imageModelURL = "./iamodels/";
      let video;
      let flippedVideo;
      let predictions = [];

      function preload() {
        classifier = ml5.imageClassifier(imageModelURL + "model.json");
      }

      function setup() {
        let lienzo = createCanvas(320, 240);
        lienzo.parent("tm-video");

        video = createCapture(VIDEO);
        video.size(320, 240);
        video.hide();

        classifyVideo();

        const button = document.getElementById("tm-audio");

        button.addEventListener("click", () => {
          if (predictions.length > 0) {
            textToSpeech(predictions[0].label);
          }
        });
      }

      function draw() {
        background(0);
        image(flippedVideo, 0, 0, width, height);
      }

      function classifyVideo() {
        flippedVideo = ml5.flipImage(video);
        classifier.classify(flippedVideo, gotResult);
        flippedVideo.remove();
      }

      function gotResult(error, results) {
        if (error) {
          console.error(error);
          return;
        }

        predictions = results;
        renderChart();
        classifyVideo();
      }

      function renderChart() {
        const chart = document.getElementById("tm-result");
        predictions.forEach((prediction) => {
          const label = prediction.label;
          const confidence = prediction.confidence * 100;

          let bar = document.getElementById(`bar-${label}`);

          if (!bar) {
            chart.innerHTML += `
              <div class="prediction">
                <div class="label">
                  <span>${label}</span>
                  <span id="percentage-${label}">0%</span>
                </div>

                <div class="bar-container">
                  <div class="bar" id="bar-${label}"></div>
                </div>
              </div>
            `;
            bar = document.getElementById(`bar-${label}`);
          }

          bar.style.width = `${confidence}%`;

          document.getElementById(`percentage-${label}`).textContent =
            `${confidence.toFixed(1)}%`;
        });
      }

      function textToSpeech(label) {
        speechSynthesis.cancel();
        const message = new SpeechSynthesisUtterance(label);
        speechSynthesis.speak(message);
      }
    </script>
  </body>
</html>
